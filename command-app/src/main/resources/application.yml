server:
  port: 8080

spring:
  application:
    name: sales-manager-command
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sales_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/realwave}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

tenant:
  prefix: rw_sm_

kafka:
  topic:
    purchase-events: rw_sm_purchase_events

outbox:
  poll:
    interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}

feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 60000

com:
  url: ${COM_URL:http://localhost:8095}
cms:
  url: ${CMS_URL:http://localhost:8090}
pcm:
  url: ${PCM_URL:http://localhost:8091}
cim:
  url: ${CIM_URL:http://localhost:8092}
coupon:
  url: ${COUPON_URL:http://localhost:8093}
mgm:
  url: ${MGM_URL:http://localhost:8094}
