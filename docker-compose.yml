version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-manager-postgres
    environment:
      POSTGRES_DB: sales_manager
      POSTGRES_USER: sales_manager
      POSTGRES_PASSWORD: sales_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sales-manager-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sales-manager-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  command-app:
    build:
      context: .
      dockerfile: command-app/Dockerfile
    container_name: sales-manager-command
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sales_manager
      DB_USERNAME: sales_manager
      DB_PASSWORD: sales_manager
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/realwave
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  query-app:
    build:
      context: .
      dockerfile: query-app/Dockerfile
    container_name: sales-manager-query
    ports:
      - "8180:8180"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sales_manager
      DB_USERNAME: sales_manager
      DB_PASSWORD: sales_manager
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/realwave
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8180/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  consumer-app:
    build:
      context: .
      dockerfile: consumer-app/Dockerfile
    container_name: sales-manager-consumer
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/sales_manager
      DB_USERNAME: sales_manager
      DB_PASSWORD: sales_manager
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/realwave
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
