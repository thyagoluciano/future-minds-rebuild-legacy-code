name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/sales-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build artifacts
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push command-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: command-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-command:latest
            ${{ env.IMAGE_PREFIX }}-command:${{ github.sha }}

      - name: Build and push query-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: query-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-query:latest
            ${{ env.IMAGE_PREFIX }}-query:${{ github.sha }}

      - name: Build and push consumer-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: consumer-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-consumer:latest
            ${{ env.IMAGE_PREFIX }}-consumer:${{ github.sha }}
